name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v6
      - uses: pmmp/setup-php-action@3.2.0
        with:
          php-version: '8.3'
          install-path: ./bin
          pm-version-major: 5
      - run: composer install --no-interaction --prefer-dist
      - run: composer validate --strict
      - run: composer lint
      - run: composer test
      - run: composer analyse
      - run: composer build
      - uses: actions/upload-artifact@v4
        with:
          name: Aegis-PM
          path: dist/Aegis-PM.phar
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: check
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Aegis-PM
      - env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release create "$GITHUB_REF_NAME" Aegis-PM.phar --verify-tag --title "Aegis-PM $GITHUB_REF_NAME" --notes "Standalone PocketMine-MP bridge for Aegis. Install the phar in plugins and configure the sidecar address. Punishments are disabled by default. Installation and configuration are documented in the README."
